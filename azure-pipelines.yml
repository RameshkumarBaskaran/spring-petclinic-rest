trigger:
- master

pool:
  name: PetClinic-Lab-Pool

variables:
- group: PetClinic-DEV-K8s
- name: MAVEN_OPTS
  value: '-Xmx2048m'

steps:
# Build and test PetClinic
- task: Maven@4
  displayName: 'Build and test PetClinic REST'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package'
    options: '-B'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'Path'
    jdkDirectory: 'C:\Program Files\Java\jdk-22'
    mavenVersionOption: 'Default'

# Copy the JAR into the artifact folder
- task: CopyFiles@2
  displayName: 'Copy JAR to artifact'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/target'
    Contents: 'spring-petclinic-rest-4.0.2.jar'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/petclinic-app'

# Copy Dockerfile from the repository
- task: CopyFiles@2
  displayName: 'Copy Dockerfile to artifact'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: 'Dockerfile'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/petclinic-app'

# Publish the JAR and Dockerfile
- task: PublishBuildArtifacts@1
  displayName: 'Publish PetClinic Docker artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/petclinic-app'
    ArtifactName: 'petclinic-app'
    publishLocation: 'Container'

# Test connectivity and authentication to DEV Kubernetes
- task: PowerShell@2
  displayName: 'Test DEV Kubernetes Connection'
  inputs:
    targetType: 'inline'
    script: |
      $headers = @{
        Authorization = "Bearer $env:K8S_TOKEN"
      }

      $response = Invoke-RestMethod `
        -Uri "$env:K8S_API_SERVER/version" `
        -Headers $headers

      Write-Host "Connected to Kubernetes API"
      Write-Host "Kubernetes version: $($response.gitVersion)"
  env:
    K8S_API_SERVER: $(K8S_API_SERVER)
    K8S_TOKEN: $(K8S_TOKEN)
