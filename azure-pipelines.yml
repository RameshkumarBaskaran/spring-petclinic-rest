
trigger:
- master

pool:
  name: PetClinic-Lab-Pool

variables:
  MAVEN_OPTS: '-Xmx2048m'

steps:
- task: Maven@4
  displayName: 'Build and test PetClinic REST'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package'
    options: '-B'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'Path'
    jdkDirectory: 'C:\Program Files\Java\jdk-22'
    mavenVersionOption: 'Default'

- task: PublishBuildArtifacts@1
  displayName: 'Publish PetClinic JAR'
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/target/spring-petclinic-rest-4.0.2.jar'
    ArtifactName: 'petclinic-app'
    publishLocation: 'Container'
